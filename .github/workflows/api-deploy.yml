name: API container and deploy

# PRs: build the production image and smoke-test it locally.
# main: apply Supabase migrations, deploy to Render, then smoke-test production.
on:
  pull_request:
    branches: [develop, main]
    paths: ["apps/api/**", "supabase/migrations/**", "render.yaml", "scripts/deploy/api-smoke.mjs", ".github/workflows/api-deploy.yml"]
  push:
    branches: [main]
    paths: ["apps/api/**", "supabase/migrations/**", "render.yaml", "scripts/deploy/api-smoke.mjs", ".github/workflows/api-deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Build production image
        run: docker build --pull -t opportunity-api:ci apps/api
      - name: Image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id opportunity-api:ci -u)" != "0"
      - name: Start container (synthetic local config only)
        run: |
          docker run -d --name api -p 8000:8000 \
            -e DATABASE_URL=sqlite:////tmp/smoke.db \
            -e CORS_ORIGINS=https://frontend.example.invalid \
            -e APP_SUPABASE_URL=https://example.invalid \
            opportunity-api:ci
          for _ in $(seq 1 30); do curl -fsS http://localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
      - name: Create schema for the smoke database
        run: docker exec api python -c "import opportunity_api.models; from opportunity_api.core.database import Base, _get_engine; Base.metadata.create_all(_get_engine())"
      - name: Smoke-test container
        env:
          API_URL: http://localhost:8000
          FRONTEND_ORIGIN: https://frontend.example.invalid
        run: node scripts/deploy/api-smoke.mjs
      - name: Container logs
        if: failure()
        run: docker logs api || true

  migrate:
    needs: container
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: npm ci
      - name: Require configuration
        run: test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD" && test -n "$SUPABASE_PROJECT_REF"
      - name: Link project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Preview pending migrations
        run: npx supabase db push --dry-run
      - name: Apply migrations
        run: npx supabase db push

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      API_URL: ${{ vars.API_PUBLIC_URL }}
      FRONTEND_ORIGIN: https://interncalling.vercel.app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Require configuration
        run: test -n "$RENDER_DEPLOY_HOOK_URL" && test -n "$RENDER_API_KEY" && test -n "$RENDER_SERVICE_ID" && test -n "$API_URL"
      - name: Trigger Render deploy of this commit
        id: trigger
        run: |
          # The hook URL is a credential: never echo it.
          response=$(curl -fsS -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${GITHUB_SHA}")
          deploy_id=$(node -e 'const b=JSON.parse(process.argv[1]); if(!/^dep-[a-z0-9]+$/.test(b?.deploy?.id??"")) process.exit(1); console.log(b.deploy.id)' "$response")
          echo "deploy_id=$deploy_id" >> "$GITHUB_OUTPUT"
      - name: Wait until the deploy is live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          for _ in $(seq 1 120); do
            status=$(curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Accept: application/json" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" | node -e 'let s="";process.stdin.on("data",c=>s+=c).on("end",()=>console.log(JSON.parse(s).status??""))')
            echo "Render deploy status: $status"
            case "$status" in
              live) exit 0 ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated) exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for Render deploy"; exit 1
      - name: Smoke-test production
        run: node scripts/deploy/api-smoke.mjs
